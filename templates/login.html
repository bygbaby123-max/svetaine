{% extends "base.html" %}
{% block title %}Prisijungimas · Mano svetainė{% endblock %}

{% block content %}
<div class="auth-box">
  <h1>Prisijungimas</h1>
  <form method="post" class="form">
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <label>Vartotojo vardas arba el. paštas
      <input type="text" name="identity" required autofocus>
    </label>
    <label>Slaptažodis
      <input type="password" name="password" required>
    </label>
    <div class="form-actions">
      <button class="btn" type="submit">Prisijungti</button>
    </div>
  </form>

  {% include "google_signin.html" %}

  <p class="muted">Dar neturi paskyros? <a href="{{ url_for('register') }}">Registruokis</a></p>
</div>
{% endblock %}
