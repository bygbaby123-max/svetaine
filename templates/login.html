{% extends "base.html" %}
{% block title %}Prisijungimas · Mano svetainė{% endblock %}

{% block content %}
<div class="auth-box">
  <h1>Prisijungimas</h1>
  <form method="post" class="form">
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <label>Vartotojo vardas arba el. paštas
      <input type="text" name="identity" required autofocus>
    </label>
    <label>Slaptažodis
      <input type="password" name="password" required>
    </label>
    <div class="form-actions">
      <button class="btn" type="submit">Prisijungti</button>
    </div>
  </form>

  {% if google_client_id %}
  <div class="divider"><span>arba</span></div>
  <div id="g_id_onload"
       data-client_id="{{ google_client_id }}"
       data-callback="onGoogleSignIn"
       data-auto_prompt="false"></div>
  <div class="g_id_signin" data-type="standard"></div>
  {% endif %}

  <p class="muted">Dar neturi paskyros? <a href="{{ url_for('register') }}">Registruokis</a></p>
</div>

{% if google_client_id %}
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
function onGoogleSignIn(response) {
  fetch('{{ url_for("auth_google") }}', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({credential: response.credential})
  })
  .then(r => r.json())
  .then(d => { if (d.ok) location.href = d.redirect; else alert(d.error || 'Klaida'); })
  .catch(() => alert('Klaida jungiantis su Google'));
}
</script>
{% endif %}
{% endblock %}
