{% if google_client_id %}
<div class="divider"><span>arba</span></div>

<button type="button" class="btn btn-google" id="google-signin-btn">
  <svg class="g-logo" viewBox="0 0 48 48" aria-hidden="true">
    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
  </svg>
  Prisijungti su Google
</button>

{# Google Identity Services: inicializavimas + matomas „pasirinkti paskyrą" atsarginis mygtukas #}
<div id="g_id_onload"
     data-client_id="{{ google_client_id }}"
     data-callback="onGoogleSignIn"
     data-auto_prompt="false"></div>

<div id="google-fallback" class="google-fallback" hidden>
  <p class="g-fallback-title">Pasirink savo Google paskyrą:</p>
  <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline"></div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
function onGoogleSignIn(response) {
  fetch('{{ url_for("auth_google") }}', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({credential: response.credential})
  })
  .then(r => r.json())
  .then(d => { if (d.ok) location.href = d.redirect; else alert(d.error || 'Klaida'); })
  .catch(() => alert('Klaida jungiantis su Google'));
}

(function () {
  function showFallback() {
    var box = document.getElementById('google-fallback');
    var btn = document.getElementById('google-signin-btn');
    if (!box || box.hidden === false) return;
    box.hidden = false;
    if (btn) btn.hidden = true;
    if (window.google && google.accounts && google.accounts.id) {
      google.accounts.id.renderButton(box.querySelector('.g_id_signin'), {
        theme: 'outline', size: 'large', text: 'signin_with', shape: 'rectangular', width: 320
      });
    }
  }

  function bind() {
    var btn = document.getElementById('google-signin-btn');
    if (!btn) return;
    if (!window.google || !google.accounts || !google.accounts.id) {
      setTimeout(bind, 100);
      return;
    }
    btn.addEventListener('click', function () {
      // One Tap parodo paskyrų pasirinkimą (jei telefone/kompiuteryje keli Google accountai)
      google.accounts.id.prompt(function (notif) {
        if (notif.isNotDisplayed() || notif.isSkippedMoment()) {
          // Google nepateikė pasirinkimo lango - parodome oficialų mygtuką su paskyrų sąrašu
          showFallback();
        }
      });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bind);
  } else {
    bind();
  }
})();
</script>
{% endif %}
